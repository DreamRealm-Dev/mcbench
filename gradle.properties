# ============================================================
# MCBench - Minecraft 通用跑分模组
# 本机构建基于离线缓存，请勿随意更改插件/加载器版本，
# 除非你知道对应依赖已在本机 Gradle 缓存中。
# ============================================================

org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dorg.gradle.internal.http.socketTimeout=30000 -Dorg.gradle.internal.http.connectionTimeout=15000
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=4


# ---------- 模组信息 ----------
mod_id=mcbench
mod_version=2.0.0
maven_group=io.mcbench
archives_base_name=mcbench

# ---------- 版本矩阵 ----------
# 指定构建哪个 Minecraft 版本配置（configs/<name>.json）
mc.version=1.21.1

# fabric-loom 版本（1.21.1 默认 1.6-SNAPSHOT；新版本可用 -Pfabric_loom_version=1.17.18 覆盖）
fabric_loom_version=1.6-SNAPSHOT
